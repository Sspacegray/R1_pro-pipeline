/**:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "body"
    beam_skip_distance: 0.5 ##场景	建议值
# 地图和激光质量较好	0.3 ~ 0.5
# 点云转 LaserScan，噪声较大	0.5 ~ 0.8
# 地图分辨率较低或地图有误差	0.7 ~ 1.0
    beam_skip_error_threshold: 0.9
#     | 现象 | 调整 |
# |---|---|
# | 动态人、箱子很多，AMCL 经常被干扰 | 降低到 `0.2 ~ 0.3` |
# | 定位过度依赖少量激光，容易漂移 | 提高到 `0.4 ~ 0.5` |
# | 普通室内环境 | `0.3` |
    beam_skip_threshold: 0.3
    do_beamskip: false    ##过滤部分动态行人
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 2.0
    update_min_a: 0.05   # 旋转约 11.5° 才更新一次
    update_min_d: 0.05   # 移动 25 cm 才更新一次
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false
