<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROS 地图编辑器</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">R1 PRO · MAP TOOLS</p>
        <h1>地图裁剪与坐标系</h1>
      </div>
      <div class="map-summary" id="map-summary">正在读取地图…</div>
    </header>

    <main class="layout">
      <aside class="panel controls">
        <section>
          <div class="section-title"><span>01</span><h2>选择裁剪区域</h2></div>
          <p class="hint">在地图上按住鼠标拖出矩形；浅蓝框内是导出范围。</p>
          <div class="field-grid four">
            <label>X（像素）<input id="crop-x" type="number" min="0" step="1" /></label>
            <label>Y（像素）<input id="crop-y" type="number" min="0" step="1" /></label>
            <label>宽度<input id="crop-width" type="number" min="1" step="1" /></label>
            <label>高度<input id="crop-height" type="number" min="1" step="1" /></label>
          </div>
          <div class="button-row">
            <button id="select-all" class="secondary" type="button">选择整张地图</button>
            <button id="fit-view" class="ghost" type="button">适应窗口</button>
          </div>
          <div class="measurement" id="crop-measurement">—</div>
        </section>

        <section>
          <div class="section-title"><span>02</span><h2>旋转坐标系</h2></div>
          <p class="hint">修改的是 YAML 的 yaw，不旋转或插值栅格像素。</p>
          <label class="wide-label">输出 yaw（度）
            <div class="angle-input">
              <input id="yaw-range" type="range" min="-180" max="180" step="0.1" />
              <input id="yaw-deg" type="number" min="-3600" max="3600" step="0.1" />
              <span>°</span>
            </div>
          </label>
          <div class="angle-presets" aria-label="角度快捷设置">
            <button type="button" data-angle="-90">−90°</button>
            <button type="button" data-angle="0">0°</button>
            <button type="button" data-angle="90">90°</button>
            <button type="button" data-angle="180">180°</button>
          </div>
          <label class="check-row">
            <input id="auto-origin" type="checkbox" checked />
            <span>自动补偿裁剪后的原点位置</span>
          </label>
          <div class="field-grid two">
            <label>输出 origin X（m）<input id="origin-x" type="number" step="0.001" /></label>
            <label>输出 origin Y（m）<input id="origin-y" type="number" step="0.001" /></label>
          </div>
        </section>

        <section>
          <div class="section-title"><span>03</span><h2>导出地图</h2></div>
          <label class="wide-label">文件名（不含扩展名）
            <input id="output-name" type="text" maxlength="128" value="mx_map_edited" />
          </label>
          <label class="check-row compact">
            <input id="overwrite" type="checkbox" />
            <span>允许覆盖同名文件</span>
          </label>
          <button id="export" class="primary" type="button">导出 PGM、PNG 和 YAML</button>
          <p class="output-path">保存到：<code id="output-dir">—</code></p>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </section>
      </aside>

      <section class="workspace">
        <div class="canvas-card map-card">
          <div class="card-heading">
            <div><span class="live-dot"></span>裁剪画布</div>
            <div class="legend"><span class="axis-x"></span>X <span class="axis-y"></span>Y</div>
          </div>
          <div class="canvas-wrap" id="map-wrap">
            <canvas id="map-canvas"></canvas>
            <div class="canvas-help">拖拽选择 · 双击恢复整图</div>
          </div>
        </div>

        <div class="canvas-card preview-card">
          <div class="card-heading">
            <div>世界坐标预览</div>
            <div id="preview-angle">yaw 0°</div>
          </div>
          <div class="preview-body">
            <canvas id="preview-canvas"></canvas>
            <div class="preview-copy">
              <p>固定十字线代表世界坐标轴，地图绕输出原点旋转。</p>
              <dl>
                <div><dt>左下角原点</dt><dd id="preview-origin">—</dd></div>
                <div><dt>输出尺寸</dt><dd id="preview-size">—</dd></div>
              </dl>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
